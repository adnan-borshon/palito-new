name: palito-development
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:dev first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:dev first}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:dev first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
